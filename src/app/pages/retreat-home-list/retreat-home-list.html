<div class="grid grid-rows-[min-content_1fr] gap-4 h-full p-2 md:p-4 lg:p-6">
  <!-- Header con título y botón de agregar -->
  <div class="flex justify-between items-center flex-wrap gap-2">
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-bold text-gray-900">Casas de Retiros</h1>
    </div>

    <div class="flex items-center gap-2">
      <!-- Botón de refrescar -->
      <p-button type="button" icon="pi pi-refresh" severity="secondary" [text]="true" [loading]="loading()" pTooltip="Refrescar datos" (onClick)="refreshData()" [attr.aria-label]="'Refrescar datos'"> </p-button>

      <!-- Botón de agregar -->
      <p-button type="button" icon="pi pi-plus" label="Agregar" severity="success" [disabled]="loading()" pTooltip="Agregar nueva casa de retiro" (onClick)="showNewRetreatDialog()" [attr.aria-label]="'Agregar nueva casa de retiro'"> </p-button>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="relative">
    <!-- Indicador de carga -->
    <div *ngIf="loading()" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center rounded-lg z-10">
      <div class="text-center">
        <i class="pi pi-spinner pi-spin text-3xl text-red-600 mb-2"></i>
        <p class="text-gray-600">Cargando casas de retiro...</p>
      </div>
    </div>

    <!-- Dataview con filtros integrados -->
    <dynamic-dataview [config]="dataviewConfig"></dynamic-dataview>
  </div>
</div>
