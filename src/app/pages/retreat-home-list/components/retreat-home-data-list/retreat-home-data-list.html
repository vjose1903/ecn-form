<p-card class="cursor-pointer" styleClass="hover:!bg-gray-100" (click)="openRetreatHomeView()">
  <div class="flex justify-between items-center flex-wrap gap-x-5 gap-y-3">
    <div class="flex items-center gap-x-3">
      <div class="hidden md:block aspect-square bg-gray-100 rounded-lg overflow-hidden border-2 border-gray-200 w-22 h-22">
        <img [src]="item.imagesData[0].url" class="w-full h-full object-cover" />
      </div>

      <div>
        <div class="mb-2">
          <p-tag [severity]="item.is_active ? 'success' : 'danger'" [value]="item.is_active ? 'Activo' : 'Inactivo'" [rounded]="true" />
        </div>

        <h3 class="text-lg font-semibold mb-2">{{ item.name || 'Sin Nombre Definido' }}</h3>
        <div class="flex flex-wrap gap-x-7 gap-y-2 text-sm text-gray-500">
          <span *ngIf="item?.address" class="flex items-center">
            <i class="pi pi-map-marker mr-1 text-red-800"></i>
            <span class="line-clamp-3">{{ item.address }}</span>
          </span>
          <span *ngIf="item?.phone" class="flex items-center">
            <i class="pi pi-phone mr-1 text-red-800"></i>
            <span class="truncate">{{ item.phone }}</span>
          </span>
        </div>
      </div>
    </div>

    <div class="flex gap-2 justify-end w-full md:w-auto">
      @if (item.is_active) {
      <p-button [disabled]="loading()" type="button" icon="pi pi-pencil" severity="secondary" size="small" [text]="true" pTooltip="Editar" tooltipPosition="left" (onClick)="$event.stopPropagation(); openEditForm()"> </p-button>
      <p-button
        [disabled]="loading()"
        type="button"
        [icon]="loading()? 'pi pi-spinner pi-spin': 'pi pi-trash'"
        severity="danger"
        size="small"
        [text]="true"
        pTooltip="Eliminar"
        (onClick)="$event.stopPropagation(); confirmToggleStatus(item)"
        tooltipPosition="left"></p-button>
      } @else {
      <p-button
        [disabled]="loading()"
        type="button"
        [icon]="loading()? 'pi pi-spinner pi-spin': 'pi pi-undo'"
        severity="success"
        size="small"
        [text]="true"
        pTooltip="Reactivar"
        (onClick)="$event.stopPropagation(); confirmToggleStatus(item)"
        tooltipPosition="left"></p-button>
      }
    </div>
  </div>
</p-card>
