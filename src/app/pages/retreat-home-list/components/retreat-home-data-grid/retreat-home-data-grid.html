<p-card 
  class="overflow-hidden relative cursor-pointer transition-all duration-200 hover:shadow-lg" 
  [class]="getLoadingClass()"
  (click)="onCardClick($event)"
  [attr.aria-label]="'Casa de retiro: ' + item.displayName"
  role="button"
  tabindex="0"
  (keydown.enter)="openRetreatHomeView()"
  (keydown.space)="openRetreatHomeView()">
  
  <ng-template #header>
    <!-- Estado -->
    <div class="absolute top-2 left-2 z-10">
      <p-tag 
        [severity]="item.statusSeverity" 
        [value]="item.statusText" 
        [rounded]="true"
        [attr.aria-label]="'Estado: ' + item.statusText" />
    </div>
    
    <!-- Imagen con lazy loading y fallback -->
    <div class="relative w-full h-48 bg-gray-100">
      <div *ngIf="!imageLoaded()" class="w-full h-full flex items-center justify-center">
        <i class="pi pi-image text-gray-400 text-4xl"></i>
      </div>
      <img 
        *ngIf="imageLoaded() && !imageError()"
        [src]="item.mainImageUrl" 
        [alt]="'Imagen de ' + item.displayName"
        class="w-full h-full object-cover transition-opacity duration-200"
        loading="lazy"
        (error)="imageError.set(true)" />
      <div *ngIf="imageError()" class="w-full h-full flex items-center justify-center bg-gray-200">
        <i class="pi pi-image text-gray-500 text-3xl"></i>
      </div>
    </div>
  </ng-template>
  
  <div class="p-4">
    <!-- Nombre -->
    <h3 class="text-md md:text-lg font-semibold mb-4 text-gray-900 line-clamp-2" [title]="item.displayName">
      {{ item.displayName }}
    </h3>

    <!-- Información de contacto -->
    <div class="space-y-2 text-xs text-gray-600 mb-3">
      <!-- Dirección -->
      <div *ngIf="item.displayAddress" class="flex items-center gap-1">
        <i class="pi pi-map-marker mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="line-clamp-2" [title]="item.displayAddress">
          {{ item.displayAddress }}
        </span>
      </div>
      
      <!-- Teléfono -->
      <div *ngIf="item.hasPhone" class="flex items-center gap-1">
        <i class="pi pi-phone mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="truncate" [title]="item.phone">
          {{ item.phone }}
        </span>
      </div>
      
      <!-- Indicador de imágenes -->
      <div *ngIf="item.hasImages" class="flex items-center gap-1">
        <i class="pi pi-images mr-1 text-blue-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="text-xs">
          {{ item.imagesData.length }} imagen{{ item.imagesData.length !== 1 ? 'es' : '' }}
        </span>
      </div>
    </div>
  </div>

  <ng-template #footer>
    <div class="flex gap-2 justify-end w-full">
      <!-- Botón de editar (solo si está activo) -->
      <p-button 
        *ngIf="item.is_active"
        [disabled]="loading()" 
        type="button" 
        icon="pi pi-pencil" 
        severity="secondary" 
        size="small" 
        [text]="true" 
        pTooltip="Editar casa de retiro" 
        tooltipPosition="left" 
        (onClick)="$event.stopPropagation(); openEditForm()"
        [attr.aria-label]="'Editar ' + item.displayName">
      </p-button>

      <!-- Botón de cambiar estado -->
      <p-button
        [disabled]="loading()"
        type="button" 
        [icon]="getStatusButtonIcon()"
        [severity]="getStatusButtonSeverity()"
        size="small"
        [text]="true"
        [pTooltip]="getStatusButtonText()"
        tooltipPosition="left"
        (onClick)="$event.stopPropagation(); confirmToggleStatus(item)"
        [attr.aria-label]="getStatusButtonText() + ' ' + item.displayName">
      </p-button>
    </div>
  </ng-template>

  <!-- Indicador de carga -->
  <div *ngIf="loading()" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center rounded-lg z-20">
    <i class="pi pi-spinner pi-spin text-2xl text-blue-600"></i>
  </div>
</p-card>
