<p-card class="cursor-pointer transition-all duration-200 hover:shadow-lg hover:scale-102 h-full" (click)="onCardClick()">
  @if (!skeleton()) {
    <div class="flex flex-col gap-2">
      <div class="w-fit">
        <p-tag [severity]="status()?.severity" [value]="status()?.label" [rounded]="true" />
      </div>
      <div>
        <small class="text-gray-500">Pareja</small>
        <h1 class="text-black font-bold text-lg">{{ request()?.displayCoupleNames }}</h1>
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-2">
      <div class="w-fit">
        <p-skeleton shape="rounded" width="80px" height="24px" />
      </div>
      <div>
        <p-skeleton width="100%" height="14px" class="mb-1" />
        <p-skeleton width="60%" height="24px" />
      </div>
    </div>
  }

</p-card>
