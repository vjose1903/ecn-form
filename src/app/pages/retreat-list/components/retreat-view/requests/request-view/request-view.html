@if (request(); as req) {
<div>
  <!-- Información básica -->
  <div class="grid grid-cols-12 gap-6">
    <!-- Estado -->
    <div class="col-span-12">
      <view-item title="Estado" icon="pi pi-info-circle" [isRow]="true" [content]="req.statusInfo.label">
        <p-tag [severity]="req.statusInfo.severity" [value]="req.statusInfo.label" [rounded]="true" />
      </view-item>
    </div>

    <div class="col-span-12 md:hidden">
      <divider-line separatorClass="my-0" />
    </div>

    <!-- Tiempo de Noviazgo -->
    <div class="col-span-12 md:col-span-6">
      <view-item title="Tiempo de Noviazgo" icon="pi pi-id-card" [content]="req.displayDatingPeriod" />
    </div>

    <div class="col-span-12 md:hidden">
      <divider-line separatorClass="my-0" />
    </div>

    <!-- Tiene fecha de boda -->
    <div class="col-span-6 {{req.have_wedding_date ? 'md:col-span-3' : ''}} ">
      <view-item title="Tiene fecha boda" icon="pi pi-check-circle" [content]="req.have_wedding_date ? 'Si' : 'No'" />
    </div>

    <!-- Fecha de boda -->
    @if (req.have_wedding_date) {
    <div class="col-span-6 md:col-span-3">
      <view-item title="Fecha de boda" icon="pi pi-calendar" [content]="req.displayWeddingDate" />
    </div>
    }

    <div class="col-span-12">
      <divider-line separatorClass="my-0" />
    </div>

    <!-- Como se enteraron del retiro -->
    <div class="col-span-12 md:col-span-6">
      <view-item title="Como se enteraron del retiro" icon="pi pi-megaphone" [content]="req.displayHowFindUs" />
    </div>

    <div class="col-span-12 md:hidden">
      <divider-line separatorClass="my-0" />
    </div>

    <!-- Quien los invitó al Retiro -->
    <div class="col-span-6 {{req.who_invited_you_phone ? 'md:col-span-3' : ''}} ">
      @if (req.who_invited_you) {
      <view-item title="Quien los invitó al Retiro" icon="pi pi-user-plus" [content]="req.who_invited_you" />
      }
    </div>

    <!-- Telefono de quien los invitó -->
    @if (req.who_invited_you_phone) {
    <div class="col-span-6 md:col-span-3">
      <view-item title="Telefono de quien los invitó" icon="pi pi-phone" [content]="req.who_invited_you_phone" />
    </div>
    }

    <div class="col-span-12">
      <divider-line separatorClass="my-2" />
    </div>

    <div class="col-span-12 md:col-span-6">
      <couple-view [couple]="req.she" [coupleType]="CoupleType.SHE" />
    </div>

    <div class="col-span-12 md:hidden">
      <divider-line separatorClass="my-4" />
    </div>

    <div class="col-span-12 md:col-span-6">
      <couple-view [couple]="req.he" [coupleType]="CoupleType.HE" />
    </div>

    <div class="col-span-12"></div>
  </div>

  <!-- Mensaje cuando no hay información completa -->

  <!-- Acciones -->
  <div class="flex justify-between gap-3 w-full pt-4 border-t border-gray-200">
    <div>
      <p-button icon="pi pi-bars" severity="secondary" (click)="menu.toggle($event)" />
      <p-menu #menu [model]="actions" [popup]="true" [appendTo]="'body'" [autoZIndex]="true" />
    </div>

    <div class="flex gap-3">
      <p-button type="button" label="Aceptar solicitud" severity="success" [disabled]="loading() || req.status == RequestStatus.ACCEPTED" icon="pi pi-check" class="w-auto" (onClick)="toggleStatus(RequestStatus.ACCEPTED)" size="small" />
      <p-button type="button" label="Rechazar solicitud" severity="danger" [disabled]="loading() || req.status == RequestStatus.REJECTED" icon="pi pi-times" class="w-auto" (onClick)="toggleStatus(RequestStatus.REJECTED)" size="small" />
    </div>
  </div>
</div>
}
