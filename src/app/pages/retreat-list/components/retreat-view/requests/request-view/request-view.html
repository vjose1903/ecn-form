@if (actionsOnly) {
  <p-menu #actionsMenu [model]="actions" [popup]="true" [appendTo]="'body'" [autoZIndex]="true" [baseZIndex]="1200" (onHide)="closeActionsMenu()" />
} @else {
@if (request(); as req) {
<div class="request-view">
  <div class="request-overview">
  <section class="request-summary" aria-label="Información principal de la solicitud">
    <div class="request-summary__item">
      <view-item title="Estado" icon="pi pi-info-circle" [content]="req.statusInfo.label">
        <p-tag [severity]="req.statusInfo.severity" [value]="req.statusInfo.label" [rounded]="true" />
      </view-item>
    </div>
    <div class="request-summary__item">
      <view-item title="Acción reciente" icon="pi pi-bolt" [content]="recentAction()" />
    </div>
    @if (isArchivedView()) {
      <div class="request-summary__item">
        <view-item title="Fecha de archivado" icon="pi pi-inbox" [content]="req.displayArchivedAt" />
      </div>
    }
    <div class="request-summary__item">
      <view-item title="Tiempo de noviazgo" icon="pi pi-id-card" [content]="req.displayDatingPeriod" />
    </div>
    <div class="request-summary__item">
      <view-item title="Tiene fecha de boda" icon="pi pi-check-circle" [content]="req.have_wedding_date ? 'Sí' : 'No'" />
    </div>
    @if (req.have_wedding_date) {
      <div class="request-summary__item">
        <view-item title="Fecha de boda" icon="pi pi-calendar" [content]="req.displayWeddingDate" />
      </div>
    }
  </section>

  <section class="request-origin" aria-label="Cómo conocieron el retiro">
    <div class="request-summary__item">
      <view-item title="Cómo se enteraron del retiro" icon="pi pi-megaphone" [content]="req.displayHowFindUs" />
    </div>
    @if (req.who_invited_you) {
      <div class="request-summary__item">
        <view-item title="Quién los invitó al retiro" icon="pi pi-user-plus" [content]="req.who_invited_you" />
      </div>
    }
    @if (req.who_invited_you_phone) {
      <div class="request-summary__item">
        <view-item title="Teléfono de quien los invitó" icon="pi pi-phone" [content]="req.who_invited_you_phone" />
      </div>
    }
  </section>

  </div>

  <div class="grid grid-cols-12 gap-6">
    <div class="col-span-12 md:col-span-6">
      <couple-view [couple]="req.she" [coupleType]="CoupleType.SHE" />
    </div>

    <div class="col-span-12 md:hidden">
      <divider-line separatorClass="my-4" />
    </div>

    <div class="col-span-12 md:col-span-6">
      <couple-view [couple]="req.he" [coupleType]="CoupleType.HE" />
    </div>

    <div class="col-span-12"></div>
  </div>

  <!-- Mensaje cuando no hay información completa -->

  <!-- Acciones -->
  <div class="request-view__actions flex justify-between gap-3 w-full pt-4 border-t border-gray-200">
    <div>
      <p-button icon="pi pi-bars" severity="secondary" (click)="menu.toggle($event)" />
      <p-menu #menu [model]="actions" [popup]="true" [appendTo]="'body'" [autoZIndex]="true" />
    </div>

    <div class="request-view__actions-buttons flex gap-3">
      @if (!isArchivedView()) {
      <p-button type="button" label="Aceptar solicitud" severity="success" [disabled]="loading() || req.status == RequestStatus.ACCEPTED" icon="pi pi-check" class="w-auto" (onClick)="toggleStatus(RequestStatus.ACCEPTED)" size="small" />
      <p-button type="button" label="Rechazar solicitud" severity="danger" [disabled]="loading() || req.status == RequestStatus.REJECTED" icon="pi pi-times" class="w-auto" (onClick)="toggleStatus(RequestStatus.REJECTED)" size="small" />
      } @else {
      <p-button type="button" label="Transferir solicitud" severity="help" [disabled]="loading()" icon="pi pi-send" class="w-auto" (onClick)="openTransferModal()" size="small" />
      <p-button type="button" label="Desarchivar solicitud" severity="success" [disabled]="loading()" icon="pi pi-replay" class="w-auto" (onClick)="unarchiveRequest()" size="small" />
      }
    </div>
  </div>
</div>
}
}
