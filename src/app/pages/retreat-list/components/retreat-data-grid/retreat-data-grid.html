<p>retreat-data-grid works!</p>

<p-card
  class="overflow-hidden relative cursor-pointer transition-all duration-200 hover:shadow-lg"
  [class]="getLoadingClass()"
  (click)="onCardClick($event)"
  [attr.aria-label]="'Retiro: ' + item.displayNumber"
  role="button"
  tabindex="0"
  (keydown.enter)="openRetreatView()"
  (keydown.space)="openRetreatView()">
  <ng-template #header>
    <!-- Estado -->
    <div class="absolute top-2 left-2 z-10">
      <p-tag [severity]="item.statusSeverity" [value]="item.statusText" [rounded]="true" [attr.aria-label]="'Estado: ' + item.statusText" />
    </div>

    <!-- Icono del retiro -->
    <div class="relative w-full h-48 bg-gray-100 flex items-center justify-center">
      <i class="pi pi-calendar text-gray-400 text-4xl"></i>
    </div>
  </ng-template>

  <div>
    <!-- Número de retiro -->
    <h3 class="text-md md:text-lg font-semibold mb-4 text-gray-900 line-clamp-2" [title]="item.displayNumber">{{ item.displayNumber }}</h3>

    <!-- Información del retiro -->
    <div class="space-y-2 text-xs text-gray-600 mb-3">
      <!-- Casa de retiro -->
      <div *ngIf="item.hasRetreatHome" class="flex items-center gap-1">
        <i class="pi pi-home mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="line-clamp-2" [title]="item.retreatHomeName"> {{ item.retreatHomeName }} </span>
      </div>

      <!-- Modalidad -->
      <div *ngIf="item.hasModality" class="flex items-center gap-1">
        <i class="pi pi-globe mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="truncate" [title]="item.displayModality"> {{ item.displayModality }} </span>
      </div>

      <!-- Fechas -->
      <div *ngIf="item.hasDates" class="flex items-center gap-1">
        <i class="pi pi-calendar mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="line-clamp-2" [title]="item.displayDateRange"> {{ item.displayDateRange }} </span>
      </div>

      <!-- Estado de solicitudes -->
      <div class="flex items-center gap-1">
        <i class="pi pi-check-circle mr-1 text-red-600 flex-shrink-0" aria-hidden="true"></i>
        <span class="truncate" [title]="item.requestsStatusText"> {{ item.requestsStatusText }} </span>
      </div>
    </div>
  </div>

  <!-- Acciones -->
  <ng-template #footer>
    <div *ngIf="showActions" class="flex justify-between items-center w-full">
      <p-button
        type="button"
        icon="pi pi-eye"
        severity="secondary"
        variant="text"
        size="small"
        [disabled]="loading()"
        (onClick)="openRetreatView()"
        pTooltip="Ver detalles"
        tooltipPosition="top"
        [attr.aria-label]="'Ver detalles de ' + item.displayNumber" />

      <div class="flex items-center gap-1">
        <p-button
          *ngIf="item.is_active"
          type="button"
          icon="pi pi-pencil"
          severity="secondary"
          variant="text"
          size="small"
          [disabled]="loading()"
          (onClick)="openEditForm()"
          pTooltip="Editar"
          tooltipPosition="top"
          [attr.aria-label]="'Editar ' + item.displayNumber" />

        <p-button
          type="button"
          [icon]="item.is_active ? 'pi pi-trash' : 'pi pi-undo'"
          [severity]="item.is_active ? 'danger' : 'success'"
          variant="text"
          size="small"
          [disabled]="loading()"
          (onClick)="confirmToggleStatus()"
          [pTooltip]="item.is_active ? 'Desactivar' : 'Activar'"
          tooltipPosition="top"
          [attr.aria-label]="(item.is_active ? 'Desactivar' : 'Activar') + ' ' + item.displayNumber" />
      </div>
    </div>
  </ng-template>
</p-card>
