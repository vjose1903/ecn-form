<div class="w-full h-full flex justify-center items-center p-6 animate-fade-in">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center animate-slide-up">
    <!-- Icono de éxito -->
    <div class="mb-6">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce-in">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-bold text-gray-800 mb-4">¡Solicitud Enviada Exitosamente!</h2>

    <!-- Mensaje principal -->
    <div class="text-gray-600 mb-6 space-y-3">
      <p class="text-lg">Su solicitud ha sido enviada correctamente.</p>
      <p class="text-base">Nuestro equipo de <strong>reclutamiento y promoción</strong> estará revisando su solicitud y contactándole lo más pronto posible.</p>
    </div>

    <!-- Información adicional -->
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
      <div class="flex items-start">
        <svg class="w-5 h-5 text-blue-600 mt-0.5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p class="text-sm text-blue-800"><strong>Importante:</strong> Recibirá un correo de confirmación en la dirección de email proporcionada.</p>
      </div>
    </div>

    <!-- Botón de acción -->
    <p-button severity="success" styleClass="w-full" label="Entendido" (click)="onClose()" />
  </div>
</div>
