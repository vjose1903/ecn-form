<div class="w-full h-full flex justify-center items-center p-6 animate-fade-in">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center transform transition-all duration-500 ease-out animate-slide-up">
    <!-- Icono de error -->
    <div class="mb-6">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce-in">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
        </svg>
      </div>
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Error</h2>

    <!-- Mensaje principal -->
    <div class="text-gray-600 mb-6 space-y-3">
      <p class="text-lg">Lo sentimos, ha ocurrido un error al cargar la información requerida.</p>
      <p class="text-base">Esto puede deberse a problemas temporales de conexión o del servidor.</p>
    </div>

    <!-- Información adicional -->
    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
      <div class="flex items-start">
        <svg class="w-5 h-5 text-yellow-600 mt-0.5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p class="text-sm text-yellow-800"><strong>Recomendación:</strong> Intente recargar la página. Si el problema persiste, contacte a nuestro equipo de <strong>reclutamiento y promoción</strong>.</p>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="space-y-3">
      <p-button severity="primary" styleClass="w-full" label="Volver a Intentar" icon="pi pi-refresh" (click)="onRetry()" [loading]="retrying()" />
    </div>
  </div>
</div>
