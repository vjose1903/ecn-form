<div class="h-full flex items-center justify-center p-4">
  <div class="max-w-md w-full space-y-8 bg-white rounded-3xl p-8 shadow-lg">
    <!-- Logo/Header -->
    <div class="text-center">
      <div class="mx-auto h-16 w-16 bg-red-600 rounded-full flex items-center justify-center">
        <i class="pi pi-lock text-white" style="font-size: 2rem"></i>
      </div>
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Iniciar Sesión</h2>
      <p class="mt-2 text-sm text-gray-600">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="formGroup" class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-7">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1"> Correo Electrónico </label>
          <div class="relative">
            <input type="text" pInputText placeholder="tu@email.com" class="w-full" [formControlName]="FormControlName.email" />

            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <i class="pi pi-at {{ isLoading() ? 'text-gray-400' : formGroup.get('email')?.invalid && formGroup.get('email')?.touched ? 'text-red-400/90' : 'text-gray-400/90'}}"></i>
            </div>
          </div>
          <form-error-msg [control]="formGroup.get('email')" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1"> Contraseña </label>
          <p-password class="w-full" inputStyleClass="w-full" [toggleMask]="true" [feedback]="false" [formControlName]="FormControlName.password" />
        </div>
      </div>

      <!-- Remember me & Forgot password -->
      <!-- <div class="flex items-center justify-end">
      <div class="text-sm">
        <a href="#" class="font-medium text-red-500 hover:text-red-800 transition-colors"> ¿Olvidaste tu contraseña? </a>
      </div>
    </div> -->

    <!-- Submit Button -->
    <div class="mt-15">
      <!-- <p-button type="button" label="test" (onClick)="onTest()" /> -->

      <p-button [disabled]="isLoading() || !formGroup.valid" type="submit" styleClass="w-full" [loading]="isLoading()">
        @if (!isLoading()) {
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <i class="pi pi-user text-red-200 group-hover:text-red-100"></i>
          </span>
        }

        @if(isLoading()) {
          <span>Iniciando sesión...</span>
        } @else {
          <span> Iniciar Sesión </span>
        }
      </p-button>
    </div>

    <!-- Sign up link -->
    <!-- <div class="text-center">
    <p class="text-sm text-gray-600">
      ¿No tienes una cuenta?
      <a href="#" class="font-medium text-red-600 hover:text-red-500 transition-colors"> Regístrate aquí </a>
    </p>
  </div> -->
</form>
</div>
</div>
