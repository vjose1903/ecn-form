@if(!isReady()){
<div class="w-full h-full flex justify-center items-center">
  <loading-component />
</div>
} @else {
<router-outlet />
<p-toast styleClass="app-toast" [breakpoints]="toastBreakpoints" />
<p-confirmdialog>
  <ng-template #message let-message>
    <div class="flex items-center w-full gap-4">
      <i [ngClass]="message.icon" class="!text-3xl text-primary-500"></i>
      <p [innerHTML]="message.message"></p>
    </div>
  </ng-template>
</p-confirmdialog>
<p-dialog />
<p-dialog
  header="Nueva versión disponible"
  [visible]="updateDialogVisible()"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(92vw, 28rem)' }">
  <div class="flex flex-col gap-4">
    <p class="m-0 text-gray-700">Hay una versión nueva de la aplicación. Se necesita refrescar la ventana para cargar la última versión.</p>

    <div class="flex justify-end">
      <p-button type="button" label="Refrescar" icon="pi pi-refresh" (onClick)="reloadForUpdate()" />
    </div>
  </div>
</p-dialog>
}
