@if(!isReady()){
<div class="w-full h-full flex justify-center items-center">
  <loading-component />
</div>
} @else {
<router-outlet />
<p-toast styleClass="app-toast" [breakpoints]="toastBreakpoints" />
<p-confirmdialog>
  <ng-template #message let-message>
    <div class="flex items-center w-full gap-4">
      <i [ngClass]="message.icon" class="!text-3xl text-primary-500"></i>
      <p [innerHTML]="message.message"></p>
    </div>
  </ng-template>
</p-confirmdialog>
<p-dialog />
<p-dialog
  [visible]="updateDialogVisible()"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [showHeader]="false"
  styleClass="update-version-dialog"
  [style]="{ width: 'min(86vw, 36rem)' }">
  <div class="update-modal-content">
    <span class="update-sparkle update-sparkle-lg update-sparkle-left"></span>
    <span class="update-sparkle update-sparkle-dot update-sparkle-dot-left"></span>
    <span class="update-sparkle update-sparkle-dot update-sparkle-dot-right"></span>
    <span class="update-sparkle update-sparkle-sm update-sparkle-right"></span>

    <div class="update-icon-ring">
      <i class="pi pi-cloud-upload"></i>
    </div>

    <h2>¡Nueva versión disponible!</h2>
    <p>Hay una versión nueva de la aplicación. Se necesita refrescar la ventana para cargar la última versión.</p>

    <div class="update-modal-actions">
      <button type="button" class="update-secondary-button" (click)="dismissUpdateDialog()">
        <i class="pi pi-times"></i>
        <span>Ahora no</span>
      </button>

      <button type="button" class="update-primary-button" (click)="reloadForUpdate()">
        <i class="pi pi-refresh"></i>
        <span>Refrescar</span>
      </button>
    </div>
  </div>
</p-dialog>
}
