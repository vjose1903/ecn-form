@if(!isReady()){
<div class="w-full h-full flex justify-center items-center">
  <loading-component />
</div>
} @else {
<router-outlet />
<p-toast />
<p-confirmdialog>
  <ng-template #message let-message>
    <div class="flex items-center w-full gap-4">
      <i [ngClass]="message.icon" class="!text-3xl text-primary-500"></i>
      <p [innerHTML]="message.message"></p>
    </div>
  </ng-template>
</p-confirmdialog>
<p-dialog />
}
