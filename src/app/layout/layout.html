<div class="grid grid-rows-[min-content_1fr_min-content] h-screen">
  <!-- Header estandarizado -->
  <div class="bg-brand-primary w-full p-2 flex items-center justify-between gap-4 text-white">
    <div class="flex items-center gap-4">
      <div class="bg-gray-100 rounded-full w-14 h-14 p-1">

        <img src="images/logo-ecn-icon.png" alt="logo" srcset="" class="w-full h-full" />
      </div>
      <div class="">
        <span class="block text-md md:text-2xl font-semibold">Encuentro Católico de Novios</span>
        @if(!isAuthRoute()){ 
          @if(city()){
            <small class="block text-white/70">{{ city()?.large_label }}</small>
          } @else {
            <p-skeleton height="19px" width="120px" class="opacity-50" />
          } 
        }
      </div>
    </div>

    <div class="flex items-center gap-2">
      @if(isAdminRoute() ){
      <p-button type="button" icon="pi pi-bars" [rounded]="true" severity="danger" class="lg:hidden" (onClick)="menuService.toggleMenu()"> </p-button>
      }
    </div>
  </div>

  <!-- Contenido de las páginas -->
  <div #contentRef class="min-h-0 min-w-0 overflow-hidden bg-gray-50/50" [ngClass]="{'grid grid-cols-[min-content_minmax(0,1fr)]': isAdminRoute()}">
    @if(isAdminRoute()){
      <app-menu [availableCities]="accessibleCities()" [activeCityId]="authService.activeCityId()" (citySelected)="selectCity($event)" />
    }
    <div class="h-full min-h-0 min-w-0 overflow-y-auto overflow-x-hidden">
      <router-outlet />
    </div>
  </div>

  <!-- Footer (opcional) -->
  <div class="bg-gray-200 w-full h-8 flex items-center justify-between text-sm gap-2 px-4">
      <span class="text-xs text-gray-500/40" aria-label="Versión de la aplicación">{{ appVersion }}</span>
    <div class="flex items-center gap-2">
      <span class="text-sm text-gray-400">© {{ currentYear }}</span>
      <span class="text-sm text-gray-500">Desarrollado por Inspot Technology</span>
    </div>
  </div>
</div>
