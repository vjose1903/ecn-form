<div class="grid grid-rows-[min-content_1fr_min-content] h-screen">
  <!-- Header estandarizado -->
  <div class="bg-red-500 w-full p-2 text-white flex items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <img src="images/Logo_ECN.png" alt="logo" srcset="" class="w-12 h-12" />
      <span class="text-2xl font-bold">Encuentro Catolico para Novios</span>
    </div>

    <div class="flex items-center gap-2">
      @if(showLogout()){
        <p-button type="button" icon="pi pi-sign-out" [rounded]="true" severity="danger"  styleClass="w-10 h-10 relative" (onClick)="logOut()"> </p-button>
      }
    </div>
  </div>

  <!-- Contenido de las páginas -->
  <div class="bg-gray-50/50">
    <router-outlet />
  </div>

  <!-- Footer (opcional) -->
  <div class="bg-gray-200 w-full h-8 flex items-center justify-end text-sm gap-2">
    <span class="text-sm text-gray-400">© {{ currentYear }}</span>
    <span class="text-sm text-gray-500">Desarrollado por Inspot Technology</span>
  </div>
</div>
