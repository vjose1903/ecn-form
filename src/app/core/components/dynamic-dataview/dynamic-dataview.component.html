<div class="card h-full">
  <div class="flex justify-content-between align-items-center mb-3 w-full">
    <div>
      <!-- <h3>Vista Dinámica - Debug</h3> -->
    </div>
    <p-selectbutton [(ngModel)]="layout" [options]="layoutOptions" [allowEmpty]="false" (onChange)="onLayoutChange($event)">
      <ng-template #item let-option>
        <i [class]="option.icon"></i>
      </ng-template>
    </p-selectbutton>
  </div>

  <!-- Vista de Lista -->
  <div *ngIf="layout() === 'list'" class="space-y-4">
    <div *ngFor="let item of data(); let i = index">
      <ng-container [dynamicList]="'list-' + i"></ng-container>
    </div>
  </div>

  <!-- Vista de Grid -->
  <div *ngIf="layout() === 'grid'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <div *ngFor="let item of data(); let i = index">
      <ng-container [dynamicGrid]="'grid-' + i"></ng-container>
    </div>
  </div>

  <!-- Mensaje cuando no hay datos -->
  <div *ngIf="!data() || data().length === 0" class="text-center p-8">
    <i class="pi pi-inbox text-4xl text-gray-400 mb-3"></i>
    <p class="text-gray-500">No hay datos disponibles</p>
  </div>
</div>
